# SPDX-License-Identifier: Apache-2.0
name: lab-brand-wall

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lab-only brand wall (stdlib; no ripgrep)
        run: PATH="/usr/bin:/bin" python3 scripts/lab_brand_wall.py
