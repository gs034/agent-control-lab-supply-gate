[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-lab-supply-gate"
version = "0.4.0"
description = "Agent Control Lab host-side agent-supply integrity gate (M1b corpus and v0.4 manifest classes; fail-closed)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Agent Control Lab" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
supply-gate-demo = "supply_gate.demo:main"

[project.urls]
Homepage = "https://github.com/gs034/agent-control-lab-supply-gate"

[tool.setuptools.packages.find]
include = ["supply_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
